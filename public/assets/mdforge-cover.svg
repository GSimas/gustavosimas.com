<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capa autoral do MDForge</title>
  <desc id="desc">Documentos transformados em blocos Markdown numa oficina digital.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171411"/><stop offset="1" stop-color="#24170f"/></linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6f52"/><stop offset="1" stop-color="#ffae5c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#f0dfd2" stroke-opacity=".07"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <g fill="#f9f2eb" font-family="Arial, sans-serif">
    <text x="72" y="108" font-size="29" font-weight="800">MD<tspan fill="#ff7957">Forge</tspan></text>
    <text x="872" y="104" font-size="12" letter-spacing="4" fill="#76ddb0">●  100% LOCAL</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M125 202h318l74 74v326H125z" fill="#26211d" stroke="#6f6259"/>
    <path d="M443 202v74h74" fill="#3a3029" stroke="#6f6259"/>
    <text x="173" y="330" fill="#ff7957" font-family="Georgia, serif" font-size="78" font-weight="700">DOC</text>
    <g stroke="#8e8178" stroke-width="10" stroke-linecap="round"><path d="M175 402h263"/><path d="M175 448h218"/><path d="M175 494h245"/></g>
  </g>
  <path d="M548 401h111" stroke="url(#forge)" stroke-width="8" stroke-linecap="round"/>
  <path d="m632 368 34 33-34 33" fill="none" stroke="#ff8b60" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="702" y="202" width="374" height="400" rx="8" fill="#201d1a" stroke="#ff7957" stroke-opacity=".55"/>
    <rect x="702" y="202" width="374" height="48" rx="8" fill="#302620"/>
    <circle cx="733" cy="226" r="6" fill="#ff7957"/><circle cx="756" cy="226" r="6" fill="#e6a651"/><circle cx="779" cy="226" r="6" fill="#76ddb0"/>
    <text x="748" y="354" fill="#ff7957" font-family="monospace" font-size="72" font-weight="700">#</text>
    <text x="824" y="354" fill="#f9f2eb" font-family="monospace" font-size="40">markdown</text>
    <g fill="#b4a8a0" font-family="monospace" font-size="24"><text x="748" y="420">**conteúdo**</text><text x="748" y="465">- estruturado</text><text x="748" y="510">- editável</text><text x="748" y="555">- portátil</text></g>
  </g>
  <text x="72" y="685" fill="#b9aaa0" font-family="Arial, sans-serif" font-size="13" letter-spacing="4">ARQUIVOS ENTRAM. MARKDOWN SAI.</text>
