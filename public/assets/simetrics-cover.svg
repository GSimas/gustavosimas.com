<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capa autoral do Simetrics</title>
  <desc id="desc">Rede científica, indicadores e mapa temático em tons de azul e violeta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a1024"/>
      <stop offset="1" stop-color="#171230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#55b9ff"/>
      <stop offset="1" stop-color="#a347ff"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#a9b7e8" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <rect x="50" y="48" width="1100" height="664" rx="28" fill="none" stroke="#9fb1e0" stroke-opacity=".18"/>
  <g fill="#dce7ff" font-family="Arial, sans-serif">
    <text x="90" y="119" font-size="26" font-weight="700">SIMETRICS</text>
    <text x="90" y="152" font-size="14" letter-spacing="4" fill="#8fa2ca">INTELIGÊNCIA BIBLIOMÉTRICA</text>
    <text x="958" y="121" font-size="13" letter-spacing="3" fill="#6fc7ff">MAPA  /  01</text>
  </g>
  <g stroke="url(#accent)" stroke-width="3" stroke-opacity=".65">
    <path d="M232 454 347 322 493 401 631 245 783 335 955 222"/>
    <path d="M232 454 407 565 493 401 708 520 783 335 965 478"/>
    <path d="M347 322 437 222 631 245 708 520 965 478"/>
  </g>
  <g fill="#0c1329" stroke="#6fc7ff" stroke-width="4">
    <circle cx="232" cy="454" r="28"/><circle cx="347" cy="322" r="21"/><circle cx="437" cy="222" r="17"/>
    <circle cx="493" cy="401" r="38"/><circle cx="631" cy="245" r="31"/><circle cx="708" cy="520" r="24"/>
    <circle cx="783" cy="335" r="43"/><circle cx="955" cy="222" r="22"/><circle cx="965" cy="478" r="34"/>
  </g>
  <g fill="#aa5cff" filter="url(#glow)">
    <circle cx="493" cy="401" r="10"/><circle cx="783" cy="335" r="12"/><circle cx="965" cy="478" r="9"/>
  </g>
  <g fill="#dce7ff" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">
    <text x="205" y="510">AUTORES</text><text x="601" y="302">TEMAS</text><text x="927" y="536">FONTES</text>
  </g>
  <g transform="translate(89 620)">
    <rect width="430" height="2" fill="url(#accent)"/>
    <text y="42" fill="#8798c1" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">INDICADORES  ·  REDES  ·  CONHECIMENTO</text>
  </g>
</svg>
