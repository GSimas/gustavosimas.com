<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capa autoral do TokenLab</title>
  <desc id="desc">Blocos de texto divididos em tokens e chunks para planejamento de RAG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050906"/><stop offset="1" stop-color="#10180d"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7ff69"/><stop offset="1" stop-color="#83c63e"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d7ff69" fill-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#dots)"/>
  <g fill="#eff4ea" font-family="Arial, sans-serif">
    <text x="70" y="106" font-size="29" font-weight="800">Token<tspan fill="#b8ed55" font-family="Georgia, serif" font-style="italic">Lab</tspan></text>
    <text x="819" y="102" font-size="12" letter-spacing="4" fill="#859582">PROCESSAMENTO LOCAL</text>
  </g>
  <text x="70" y="215" fill="#b8ed55" font-family="Arial, sans-serif" font-size="13" letter-spacing="5">PLANEJE ANTES DE INDEXAR</text>
  <text x="70" y="286" fill="#eff4ea" font-family="Georgia, serif" font-size="62">Da base ao chunk,</text>
  <text x="70" y="348" fill="#eff4ea" font-family="Georgia, serif" font-size="62">cada token conta.</text>
  <g transform="translate(72 421)" font-family="monospace">
    <rect width="1056" height="202" rx="14" fill="#0d150f" stroke="#576555"/>
    <g font-size="17" font-weight="700">
      <rect x="28" y="32" width="116" height="42" rx="6" fill="url(#lime)"/><text x="47" y="59" fill="#11180e">TOK_001</text>
      <rect x="153" y="32" width="116" height="42" rx="6" fill="#1e2a20" stroke="#8faa78"/><text x="172" y="59" fill="#ccdbc5">TOK_002</text>
      <rect x="278" y="32" width="116" height="42" rx="6" fill="#1e2a20" stroke="#8faa78"/><text x="297" y="59" fill="#ccdbc5">TOK_003</text>
      <rect x="403" y="32" width="116" height="42" rx="6" fill="url(#lime)"/><text x="422" y="59" fill="#11180e">TOK_004</text>
      <rect x="528" y="32" width="116" height="42" rx="6" fill="#1e2a20" stroke="#8faa78"/><text x="547" y="59" fill="#ccdbc5">TOK_005</text>
    </g>
    <path d="M28 112H644" stroke="#71816e" stroke-width="3" stroke-dasharray="8 10"/>
    <rect x="704" y="25" width="316" height="151" rx="10" fill="#131d15" stroke="#b8ed55" stroke-opacity=".55"/>
    <text x="732" y="60" fill="#849180" font-size="12" letter-spacing="2">CHUNKS GERADOS</text>
    <text x="732" y="133" fill="#eff4ea" font-size="64">24</text>
    <text x="882" y="106" fill="#b8ed55" font-size="16">512 TOKENS</text>
    <text x="882" y="135" fill="#849180" font-size="14">64 OVERLAP</text>
  </g>
  <text x="70" y="690" fill="#839080" font-family="Arial, sans-serif" font-size="13" letter-spacing="4">TOKENS  ·  CHUNKING  ·  EMBEDDINGS  ·  RAG</text>
</svg>
