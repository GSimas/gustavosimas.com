<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capa autoral do artigo do ECKM 2024</title>
  <desc id="desc">Engenharia, Gestão e Mídia do Conhecimento sobrepostas, com a agenda de pesquisa no encontro das três.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f1030"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a5b4fc" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="106" font-size="29" font-weight="800" fill="#f1f5f9">KEMM<tspan fill="#a5b4fc"> · ECKM 2024</tspan></text>
    <text x="806" y="102" font-size="12" letter-spacing="4" fill="#8b8fc4">25ª CONFERÊNCIA EUROPEIA · GESTÃO DO CONHECIMENTO</text>
  </g>
  <text x="70" y="205" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="13" letter-spacing="5">UMA AGENDA DE PESQUISA</text>
  <text x="70" y="276" fill="#f1f5f9" font-family="Georgia, serif" font-size="58">Três campos que só</text>
  <text x="70" y="334" fill="#f1f5f9" font-family="Georgia, serif" font-size="58">funcionam juntos.</text>
  <g transform="translate(790 500)">
    <g fill="#6366f1" fill-opacity=".22" stroke="#a5b4fc" stroke-width="2">
      <circle cx="0" cy="-78" r="128"/>
      <circle cx="-112" cy="72" r="128"/>
      <circle cx="112" cy="72" r="128"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#e0e3ff" text-anchor="middle" letter-spacing="1">
      <text x="0" y="-140">ENGENHARIA</text>
      <text x="-186" y="176">GESTÃO</text>
      <text x="186" y="176">MÍDIA</text>
    </g>
    <circle cx="0" cy="22" r="9" fill="#f1f5f9"/>
  </g>
  <g transform="translate(70 430)" font-family="monospace" font-size="15" fill="#9aa0d8">
    <text x="0" y="0">revisão de escopo · 5 etapas</text>
    <text x="0" y="40">paradigmas ocidental e oriental em contraste</text>
    <text x="0" y="80">organizações intensivas em conhecimento</text>
  </g>
  <text x="70" y="722" fill="#8b8fc4" font-family="Arial, sans-serif" font-size="13" letter-spacing="4">CONTI  ·  SIMAS DA SILVA  ·  ANDRADE  —  UFSC</text>
</svg>
