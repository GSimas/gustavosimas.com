<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capa autoral do Colorima</title>
  <desc id="desc">Nomes de cores escritos em cores que os contradizem, o conflito do efeito Stroop invertido.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d16"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#22d3ee" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="106" font-size="29" font-weight="800" fill="#f1f5f9">Color<tspan fill="#22d3ee">ima</tspan></text>
    <text x="880" y="102" font-size="12" letter-spacing="4" fill="#7c8aa3">EFEITO STROOP INVERTIDO</text>
  </g>
  <text x="70" y="215" fill="#a855f7" font-family="Arial, sans-serif" font-size="13" letter-spacing="5">NÃO LEIA A PALAVRA</text>
  <text x="70" y="286" fill="#f1f5f9" font-family="Georgia, serif" font-size="62">Responda à cor,</text>
  <text x="70" y="348" fill="#f1f5f9" font-family="Georgia, serif" font-size="62">não ao que está escrito.</text>
  <g font-family="Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="2">
    <text x="72" y="470" fill="#ef4444">VERDE</text>
    <text x="330" y="470" fill="#3b82f6">AMARELO</text>
    <text x="700" y="470" fill="#22c55e">VERMELHO</text>
    <text x="72" y="556" fill="#ffd200">ROXO</text>
    <text x="280" y="556" fill="#f97316">AZUL</text>
    <text x="470" y="556" fill="#a855f7">LARANJA</text>
    <text x="800" y="556" fill="#22d3ee">?</text>
  </g>
  <g transform="translate(70 610)">
    <rect width="1060" height="1" fill="#22d3ee" fill-opacity=".25"/>
    <g font-family="monospace" font-size="15" fill="#8ea3bd">
      <text x="0" y="42">CLÁSSICO — 3 vidas, combos e fases</text>
      <text x="380" y="42">RUSH — 1 vida, o tempo encurtando</text>
      <text x="790" y="42">ZEN — sem placar</text>
    </g>
  </g>
  <text x="70" y="722" fill="#7c8aa3" font-family="Arial, sans-serif" font-size="13" letter-spacing="4">ATENÇÃO  ·  INIBIÇÃO  ·  REFLEXO</text>
</svg>
