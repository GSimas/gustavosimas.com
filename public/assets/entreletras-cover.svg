<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capa autoral do Entreletras</title>
  <desc id="desc">Tabuleiro com a palavra AMOR na horizontal e as verticais ASA, MESA e RIO cruzando suas letras.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17150f"/><stop offset="1" stop-color="#221f18"/></linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="106" font-size="29" font-weight="800" fill="#f4eee4">Entre<tspan fill="#c0b6a6" font-family="Georgia, serif" font-style="italic">letras</tspan></text>
    <text x="930" y="102" font-size="12" letter-spacing="4" fill="#8a8172">TRAMA · BISTRÔ</text>
  </g>
  <text x="70" y="215" fill="#c0b6a6" font-family="Arial, sans-serif" font-size="13" letter-spacing="5">UMA HORIZONTAL, MUITAS VERTICAIS</text>
  <text x="70" y="286" fill="#f4eee4" font-family="Georgia, serif" font-size="62">Escreva uma palavra,</text>
  <text x="70" y="348" fill="#f4eee4" font-family="Georgia, serif" font-size="62">siga por outra letra.</text>
  <g transform="translate(72 378)" font-family="Georgia, serif" font-size="42" text-anchor="middle">
    <g>
      <rect x="0" y="0" width="72" height="72" rx="8" fill="#4f7a3a"/><text x="36" y="51" fill="#f4eee4">A</text>
      <rect x="80" y="0" width="72" height="72" rx="8" fill="#8a7530"/><text x="116" y="51" fill="#f4eee4">M</text>
      <rect x="160" y="0" width="72" height="72" rx="8" fill="#2c2921" stroke="#5a5346"/><text x="196" y="51" fill="#f4eee4">O</text>
      <rect x="240" y="0" width="72" height="72" rx="8" fill="#4f7a3a"/><text x="276" y="51" fill="#f4eee4">R</text>
    </g>
    <g fill="#c0b6a6">
      <rect x="0" y="80" width="72" height="72" rx="8" fill="#2c2921" stroke="#453f35"/><text x="36" y="131">S</text>
      <rect x="0" y="160" width="72" height="72" rx="8" fill="#2c2921" stroke="#453f35"/><text x="36" y="211">A</text>
      <rect x="80" y="80" width="72" height="72" rx="8" fill="#2c2921" stroke="#453f35"/><text x="116" y="131">E</text>
      <rect x="80" y="160" width="72" height="72" rx="8" fill="#2c2921" stroke="#453f35"/><text x="116" y="211">S</text>
      <rect x="80" y="240" width="72" height="72" rx="8" fill="#2c2921" stroke="#453f35"/><text x="116" y="291">A</text>
      <rect x="240" y="80" width="72" height="72" rx="8" fill="#2c2921" stroke="#453f35"/><text x="276" y="131">I</text>
      <rect x="240" y="160" width="72" height="72" rx="8" fill="#2c2921" stroke="#453f35"/><text x="276" y="211">O</text>
    </g>
    <circle cx="196" cy="116" r="7" fill="#6d6455"/>
  </g>
  <g transform="translate(560 400)" font-family="Arial, sans-serif">
    <rect width="568" height="200" rx="14" fill="#1d1a14" stroke="#453f35"/>
    <text x="40" y="52" fill="#8a8172" font-size="12" letter-spacing="3">O DICIONÁRIO RESPONDE</text>
    <text x="40" y="112" fill="#f4eee4" font-family="Georgia, serif" font-size="44">1 a 12 letras</text>
    <text x="40" y="156" fill="#c0b6a6" font-size="16">cada letra é um cruzamento possível</text>
    <text x="40" y="182" fill="#6d6455" font-size="14">o ponto marca a coluna onde nada cabe</text>
  </g>
  <text x="70" y="726" fill="#8a8172" font-family="Arial, sans-serif" font-size="13" letter-spacing="4">PALAVRA DO DIA  ·  CADEIA SEM FIM  ·  IMAGEM E GIF</text>
</svg>
