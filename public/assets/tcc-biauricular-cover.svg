<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Capa autoral do TCC sobre pistas biauriculares</title>
  <desc id="desc">Arco de azimute com a fala à frente e o ruído à esquerda, as duas direções que o algoritmo precisa distinguir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121619"/><stop offset="1" stop-color="#1b2227"/></linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="106" font-size="29" font-weight="800" fill="#f0ede6">Pistas <tspan fill="#7fd1c1" font-family="Georgia, serif" font-style="italic">biauriculares</tspan></text>
    <text x="900" y="102" font-size="12" letter-spacing="4" fill="#7f8b8f">UFSC · 2021</text>
  </g>
  <text x="70" y="205" fill="#7fd1c1" font-family="Arial, sans-serif" font-size="13" letter-spacing="5">ENGENHARIA ELETRÔNICA · TCC</text>
  <text x="70" y="276" fill="#f0ede6" font-family="Georgia, serif" font-size="58">Silenciar o ruído</text>
  <text x="70" y="334" fill="#f0ede6" font-family="Georgia, serif" font-size="58">e saber de onde ele vem.</text>
  <g transform="translate(600 620)">
    <g fill="none" stroke="#3c4a50" stroke-width="1.5">
      <path d="M-420 0 A420 420 0 0 1 420 0"/>
      <path d="M-300 0 A300 300 0 0 1 300 0"/>
      <path d="M-180 0 A180 180 0 0 1 180 0"/>
    </g>
    <g stroke="#3c4a50" stroke-width="1" stroke-dasharray="4 7">
      <path d="M0 0 L0 -420"/><path d="M0 0 L-297 -297"/><path d="M0 0 L297 -297"/>
    </g>
    <path d="M0 0 L109 -405" stroke="#7fd1c1" stroke-width="4"/>
    <circle cx="109" cy="-405" r="13" fill="#7fd1c1"/>
    <path d="M0 0 L-364 -210" stroke="#e2725b" stroke-width="4"/>
    <circle cx="-364" cy="-210" r="13" fill="#e2725b"/>
    <circle cx="0" cy="0" r="9" fill="#f0ede6"/>
    <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
      <text x="132" y="-398" fill="#7fd1c1">FALA · +15°</text>
      <text x="-460" y="-232" fill="#e2725b">RUÍDO · −60°</text>
    </g>
    <g font-family="monospace" font-size="12" fill="#6c7a80">
      <text x="-424" y="24">−90°</text><text x="-14" y="-432">0°</text><text x="392" y="24">+90°</text>
    </g>
  </g>
  <text x="70" y="722" fill="#7f8b8f" font-family="Arial, sans-serif" font-size="13" letter-spacing="4">FILTRO DE WIENER  ·  PROCESSAMENTO BIAURICULAR  ·  APARELHOS AUDITIVOS</text>
</svg>
